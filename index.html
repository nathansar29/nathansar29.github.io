<h2>2. Victor Wembanyama</h2>
  <p>The definitive second pick. Wembanyama completely alters fantasy builds, fresh off a spectacular campaign averaging 25.0 PPG, 11.5 RPG, and 3.1 BPG. His historic block volume creates an instant statistical advantage in category leagues, while his high ceiling makes him the only player capable of challenging Jokić for the absolute fantasy crown. Wembanyama continues to grow his skills as time goes on</p>

<h2>3. Luka Donic</h2>
  <p>Some people may say that Shai should be over Luka, but I disagree. With everyone good off the team, Luka is the ultimate floor pick. He's coming off a massive season where he averaged 33.5 points, 7.7 rebounds, and 8.3 assists per game. Now that there’s absolutely nobody left to take shots away from him, he's going to carry an even more impossible workload. Expect massive stats on volume alone.</p>
